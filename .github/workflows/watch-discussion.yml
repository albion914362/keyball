# 開発者への質問 (albion914362 が他の人のリポジトリに立てた Discussion・Issue
# と .github/watch-questions.txt に書いたもの) に回答が付いたかを確認し、
# 新しい書き込みがあれば Issue (ラベル「質問の回答」) で知らせる。
# 書き込みが編集されたときは、前回確認した文との差分を Issue にコメントする。
# 中身は .github/scripts/watch_questions.py
name: 質問への回答チェック

on:
  # GitHub の定期実行は混雑で大きく遅れたり抜けたりするため使わない。
  # Claude の定期タスク (2 時間ごとの 00 分) が手動実行し、結果を見て通知する。
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check questions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          QUESTION_AUTHOR: albion914362
        run: python3 .github/scripts/watch_questions.py
