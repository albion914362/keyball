# 開発者への質問 (Yowkees/keyball-link の Discussion) に回答が付いたかを
# 3 時間ごとに確認し、新しい書き込みがあれば Issue (ラベル「質問の回答」) で知らせる。
# 見張る Discussion を変えるときは下の REPO と NUMBER を書き換える。
name: 質問への回答チェック

on:
  schedule:
    - cron: '23 */3 * * *' # 3 時間ごと
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check discussion
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          REPO=Yowkees/keyball-link
          NUMBER=12

          DATA=$(gh api graphql -F owner="${REPO%/*}" -F name="${REPO#*/}" -F number="$NUMBER" -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                discussion(number: $number) {
                  title url
                  author { login }
                  answer { url }
                  comments(last: 20) {
                    totalCount
                    nodes {
                      author { login } createdAt url body
                      replies(last: 20) { totalCount nodes { author { login } createdAt url body } }
                    }
                  }
                }
              }
            }')
          D=$(echo "$DATA" | jq '.data.repository.discussion')
          ME=$(echo "$D" | jq -r '.author.login')
          # 質問者以外の書き込み (コメントと返信) を新しい順に並べる
          POSTS=$(echo "$D" | jq --arg me "$ME" '[.comments.nodes[] | ., (.replies.nodes[])]
            | map(select(.author.login != $me)) | sort_by(.createdAt) | reverse')
          COUNT=$(echo "$POSTS" | jq length)
          TITLE=$(echo "$D" | jq -r .title)
          URL=$(echo "$D" | jq -r .url)
          echo "質問者以外の書き込み: $COUNT 件" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$COUNT" -eq 0 ] && exit 0

          LATEST=$(echo "$POSTS" | jq -r '.[0].url')
          {
            echo "<!-- discussion-watch: $REPO#$NUMBER latest: $LATEST -->"
            echo "質問「[$TITLE]($URL)」に回答・返信が付きました（質問者以外の書き込み $COUNT 件）。"
            echo
            echo "$POSTS" | jq -r '.[:5][] | "### \(.author.login)（\(.createdAt[:10])）\n\n\(.body)\n\n[元の書き込み](\(.url))\n"'
          } > body.md

          gh label create "質問の回答" --color 1D76DB --description "開発者への質問に回答があった" --force
          gh label create "解説済み" --color 0E8A16 --description "Claude が解説を書いた" --force

          ISSUE=$(gh issue list --label "質問の回答" --state all --limit 50 --json number,body,state \
            --jq "map(select(.body | contains(\"discussion-watch: $REPO#$NUMBER \"))) | .[0] // empty")
          if [ -z "$ISSUE" ]; then
            gh issue create --title "質問に回答あり: $TITLE" --label "質問の回答" --body-file body.md
          elif echo "$ISSUE" | grep -qF "latest: $LATEST "; then
            echo "前回から新しい書き込みはない" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            NUM=$(echo "$ISSUE" | jq -r .number)
            gh issue reopen "$NUM" || true
            gh issue edit "$NUM" --body-file body.md --remove-label "解説済み"
            gh issue comment "$NUM" --body "新しい書き込みがありました。本文を最新の内容に書き換えました。"
          fi
